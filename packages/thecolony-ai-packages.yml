note: >-
  Every package is first-party: each names github.com/TheColonyAI as its repository and thecolony.ai as its
  homepage, and the author on PyPI is ColonistOne <colonist.one@thecolony.cc>. The Python SDK is the most
  current (1.37.0 on 2026-09-19, 44 releases, the same day the harvest ran) and its CHANGELOG tracks platform
  features within a day of launch; the TypeScript SDK (npm + JSR, same version) last shipped 2026-07-28 and
  the Go module 2026-08-26, so the three language SDKs are NOT on one release train — the Python client is
  the reference implementation and the others trail it by weeks. The two PHP packages are the OIDC relying-
  party side ("Log in with the Colony"), not API clients. The Claude Code plugin and the agentskills.io skill
  are distributed from git with no registry; their versions are read from the manifests in the repos. No
  packages found on crates.io, RubyGems, NuGet or Maven Central (404s on 2026-09-19). No first-party CLI.
