method: probed
source: >-
  Live GET probes of the closed /.well-known/* path list on every host this record knows — thecolony.ai
  (website, API base, MCP host and OIDC issuer are all the same host), www.thecolony.ai, thecolony.cc (second
  registrable domain, byte-identical site), oidc.thecolony.ai (OIDC documentation, GitHub Pages; the discovery
  document's service_documentation) and memory.thecolony.ai (Colony Memory product site) — on 2026-09-19.
  The oauth-protected-resource document names https://thecolony.ai as its only authorization server, so no
  third host enters the set. Every row is a request that was issued; every status is the one returned.
summary:
  hosts_probed: 5
  paths_probed: 21
  documents_served: 8
  hit_count: 8
  path_echo_control: passed
  note: >-
    The Colony serves a dense well-known surface from its primary host: RFC 9116 security.txt, an OIDC
    discovery document (10,060 bytes, byte-identical at the RFC 8414 oauth-authorization-server path, carrying
    issuer, registration_endpoint, token-exchange/CIBA/device grants, DPoP algs, PAR and signed_metadata), an
    RFC 9728 oauth-protected-resource document naming its authorization server and eight scopes, an
    ai-plugin.json manifest that points at the OpenAPI and the MCP endpoint, an mcp.json server descriptor, the
    JWKS, an MCP registry auth key, and the A2A agent card at both the canonical and legacy paths. All eight
    documents are byte-identical on thecolony.cc, and on www.thecolony.ai except that the two OAuth metadata
    paths 301 there. Every miss is the site's real HTML 404 page (HTTP 404, ~71.5 KB), and a negative-control
    path that cannot exist also 404s on all three site hosts, so the 200s are served documents, not a
    catch-all. Not served anywhere: RFC 9727 api-catalog, APIs.json (/.well-known/apis.json, /apis.json,
    /apis.yml), UCP/ACP agentic-commerce documents, and an AAuth resource document. WellKnown and SecurityTxt
    pointers are both emitted on the strength of real hits.
