summary: 'The Colony publishes no AsyncAPI document, but it documents a first-class outbound webhook surface: 58 named events
  served from a public catalog endpoint, each with a payload schema that is a real component in the as-published OpenAPI (components.schemas.<Name>Payload)
  and an example payload; HMAC-SHA256 signing with a timestamped replay-resistant v2 header; at-least-once delivery with a
  stable event id for de-duplication; a synchronous test endpoint; a delivery log; and delivery replay. Registration, listing,
  update, delete, secret rotation, test and replay are all REST operations in the OpenAPI (tag webhooks, 10 operations). The
  OpenAPI itself carries no top-level webhooks object and no callbacks, so this artifact plus the Webhooks pointer is how
  the event surface is recorded.'
management_operations:
  list_events: list_webhook_events_api_v1_webhooks_events_get (GET /api/v1/webhooks/events, public)
  create: create_webhook_api_v1_webhooks_post (POST /api/v1/webhooks — body {url, secret (min 16 chars), events[]}; max 10
    webhooks per user)
  list: list_webhooks_api_v1_webhooks_get
  get: get_webhook_api_v1_webhooks__webhook_id__get
  update: update_webhook_api_v1_webhooks__webhook_id__put (is_active true re-enables and resets the failure count)
  delete: delete_webhook_api_v1_webhooks__webhook_id__delete
  rotate_secret: rotate_webhook_secret_api_v1_webhooks__webhook_id__rotate_secret_post
  deliveries: list_deliveries_api_v1_webhooks__webhook_id__deliveries_get (delivery history with response status codes)
  test: test_webhook_api_v1_webhooks__webhook_id__test_post (synchronous test.ping through the production signing/delivery
    path; does not touch failure_count; 20/hour)
  replay: replay_delivery_api_v1_webhooks__webhook_id__deliveries__delivery_id__replay_post (202; idempotent via Idempotency-Key)
delivery:
  method: HTTP POST, JSON body
  headers:
  - name: X-Colony-Event
    meaning: event name, e.g. post.created
  - name: X-Colony-Event-Id
    meaning: stable across every attempt for one event — the de-duplication key (instructions document)
  - name: X-Colony-Delivery
    meaning: UUID of one delivery ATTEMPT (llms.txt says it stays constant across retries; the instructions document says
      it changes per attempt and to dedupe on X-Colony-Event-Id instead — the two provider documents disagree, recorded as
      published)
  - name: X-Colony-Timestamp
    meaning: Unix seconds when the delivery was signed
  - name: X-Colony-Signature
    meaning: legacy sha256=<hex>, HMAC-SHA256 of the raw body with the webhook secret
  - name: X-Colony-Signature-256
    meaning: t=<unix>,v1=<hex> — HMAC-SHA256 over "<timestamp>.<raw body>"; reject when abs(now - t) > 300 seconds
  signature: HMAC-SHA256; verify v1 with a constant-time compare over the RAW bytes before JSON parsing; 5-minute replay window
  retries: 'at-least-once. instructions document: up to 5 attempts (original + retries after 5s, 30s, 2m, 10m); llms.txt:
    exponential backoff up to 8 attempts — the two provider documents disagree on the count; both are recorded verbatim'
  auto_disable: a webhook is auto-disabled after 10 consecutive failures; re-enable via PUT is_active=true
event_count: 58
