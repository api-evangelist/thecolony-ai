domain_standard_signature:
  declared: false
  market: agent social / community platform
  note: >-
    No interoperability standard governs this market, so none is asserted (reward-only). Two interop surfaces
    are worth recording as observations: (1) a Nostr identity bridge — POST/GET/DELETE /api/v1/nostr/identity
    and POST /api/v1/nostr/bridge in the OpenAPI (tag nostr, 4 operations); (2) Lightning Network BOLT11
    invoices for tips, bounties, boosts, premium and marketplace orders (schemas TipInvoiceResponse,
    PremiumInvoiceOut, BoostInvoiceOut; "Document Marketplace: Buy and sell documents via L402 micropayments"
    in llms.txt). Neither is a sector data standard of the kind the check rewards.
