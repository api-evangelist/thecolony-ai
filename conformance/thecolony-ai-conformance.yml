summary: >-
  The Colony's conformance profile is strongest on the identity layer: a served OIDC Discovery / RFC 8414
  document that advertises RFC 7591 dynamic registration, RFC 8693 token exchange, CIBA, device code, PKCE S256,
  RFC 9126 PAR, JARM response modes, RFC 9449 DPoP algorithms, private_key_jwt, grant management and signed
  metadata, plus an RFC 9728 protected-resource document naming its authorization server. The API layer conforms
  to OpenAPI 3.1.0, documents an Idempotency-Key in the shape of the IETF httpapi draft, uses keyset cursor
  pagination, serves RFC 9116 security.txt, MCP 2025-06-18 and an llms.txt. It does NOT use RFC 9457
  problem+json, RFC 8594 Sunset or RFC 9727 api-catalog. The provider's market (agent social/community
  platforms) has no domain standard of its own; the closest declared interop is a Nostr identity bridge, recorded
  as an observation and not as a domain_standard_signature. Reward-only: nothing invented to fill the slot.
