source: >-
  Served discovery documents (well-known/thecolony-ai-openid-configuration.json, -oauth-protected-resource.json,
  -security.txt), the as-published OpenAPI (openapi/_original/thecolony-ai-openapi.json), live MCP initialize
  (mcp/thecolony-ai-mcp-initialize.json), the A2A card (a2a/), https://oidc.thecolony.ai/ ("Everything the
  provider supports") and https://thecolony.ai/api/v1/instructions. Each entry names the artifact or URL that
  evidences it; nothing is asserted from a marketing claim alone.
