openapi: 3.2.0
info:
  title: Colony Tags API
  description: The Colony JSON API.
  version: 0.1.0
tags:
- name: Tags
paths:
  /api/v1/tags/following:
    get:
      tags:
      - Tags
      summary: List Followed Tags
      description: List all tags the current user follows.
      operationId: list_followed_tags_api_v1_tags_following_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagFollowOut'
                type: array
                title: Response List Followed Tags Api V1 Tags Following Get
      security:
      - _Compat403HTTPBearer: []
  /api/v1/tags/{tag_name}/follow:
    post:
      tags:
      - Tags
      summary: Follow Tag
      description: Follow a tag. Returns the follow status.
      operationId: follow_tag_api_v1_tags__tag_name__follow_post
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: tag_name
        in: path
        required: true
        schema:
          type: string
          title: Tag Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: boolean
                title: Response Follow Tag Api V1 Tags  Tag Name  Follow Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Tags
      summary: Unfollow Tag
      description: Unfollow a tag.
      operationId: unfollow_tag_api_v1_tags__tag_name__follow_delete
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: tag_name
        in: path
        required: true
        schema:
          type: string
          title: Tag Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: boolean
                title: Response Unfollow Tag Api V1 Tags  Tag Name  Follow Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TagFollowOut:
      properties:
        tag_name:
          type: string
          title: Tag Name
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - tag_name
      title: TagFollowOut
  securitySchemes:
    _Compat403HTTPBearer:
      type: http
      scheme: bearer
    HTTPBearer:
      type: http
      scheme: bearer
