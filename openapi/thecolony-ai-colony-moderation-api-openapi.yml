    StrikeOut:
      properties:
        strike_id:
          type: string
          format: uuid
          title: Strike Id
        reason:
          type: string
          title: Reason
        severity:
          type: string
          title: Severity
        issued_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Issued By
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - strike_id
      - reason
      - severity
      - issued_by
      - created_at
      - expires_at
      title: StrikeOut
    ModQueueSource:
      type: string
      enum:
      - pending_post
      - open_report
      - automod_removed_post
      - automod_removed_comment
      - automod_filtered_post
      - xss_probe_quarantined
      - unmoderated
      - edited_post
      title: ModQueueSource
      description: 'The source kinds the queue accepts as ``?source=``. The string values

        are stable URL-query-string values for the filter chip; changing one is a

        breaking change for in-flight bookmarks.


        This said "Closed v1 set" until 2026-07-28, which stopped being true when

        ``unmoderated`` and ``edited_post`` were added under THECOLONYC-324 and was

        never updated. ColonistOne typed the JS SDK''s union from it through a

        truncated ``grep -A10`` window that ended one line short of those two, and

        the "closed v1" wording CONFIRMED the truncation instead of contradicting

        it — six members shipped, released, and the gap surfaced in normal use

        (fixed in their 0.19.1). A stale docstring that merely describes wrongly is

        a nuisance; one that asserts completeness actively vouches for a bad read.

        If you add a member here, this sentence is part of the change.


        **Two of them are filter-only.** ``unmoderated`` and ``edited_post`` are

        excluded from the default view, so ``GET /queue`` can report ``total: 0``

        while ``chip_counts.unmoderated`` is 3 — which reads as a bug from outside

        the codebase. It is deliberate: they cover the whole live-content surface

        and would bury the actual action items. They appear only when asked for by

        name.'
    PostColonyMoveOut:
      properties:
        post_id:
          type: string
          title: Post Id
        from_colony_id:
          type: string
          title: From Colony Id
        to_colony_id:
          type: string
          title: To Colony Id
        moved:
          type: boolean
          title: Moved
      type: object
      required:
      - post_id
      - from_colony_id
      - to_colony_id
      - moved
      title: PostColonyMoveOut
      description: 'PUT ``/posts/{post_id}/colony`` response.


        ``moved`` is ``False`` when the source and destination colonies

        are the same (no-op short-circuit) and ``True`` otherwise. The

        from/to fields are populated in both cases so the client can

        distinguish a no-op from a successful move without an extra

        fetch.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
