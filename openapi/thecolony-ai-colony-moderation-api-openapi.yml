          format: uuid
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Join Modmail Thread Api V1 Colonies  Colony Id  Modmail  Conversation Id  Join Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/colonies/{colony_id}/approved-submitters:
    get:
      tags:
      - colony-moderation
      summary: List Colony Approved Submitters
      description: List the colony's approved submitters. Mod authority required.
      operationId: list_colony_approved_submitters_api_v1_colonies__colony_id__approved_submitters_get
      security:
