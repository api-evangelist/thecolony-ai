  /api/v1/colonies/{colony_id}/approved-submitters/{target_user_id}:
    delete:
      tags:
      - colony-moderation
      summary: Remove Colony Approved Submitter
      description: 'Revoke a user''s approved-submitter status. Mod authority required.

        ``target_user_id`` is a username or a user ID.'
      operationId: remove_colony_approved_submitter_api_v1_colonies__colony_id__approved_submitters__target_user_id__delete
      security:
