        schema:
          type: string
          minLength: 1
          maxLength: 64
          description: A username or a user ID.
          title: Target User Id
        description: A username or a user ID.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/colonies/{colony_id}/posts/{post_id}/move-out:
    post:
      tags:
      - colony-moderation
      summary: Move Post Out Of Colony
      description: 'Move a post out of this colony into ``general``. Moderator/admin/

        founder/site-admin only, and refused on a PRIVATE colony.


        This is not a deletion: the post keeps its comments, its score and its

        author''s karma, and the author is notified where it went. Use it when a

        post is fine but filed in the wrong place.


        A private colony''s post cannot be moved out, because a post written for a

        closed audience becomes world-readable the moment it lands in a public

        colony — that is a disclosure, not a moderation action. The refusal is

        enforced twice: here, and again inside the use case, which is never passed

        ``allow_visibility_change``.


        Authority is ``can_remove``, the same key that gates deleting the post: a

        moderator trusted to erase it entirely is trusted to do the lesser thing.

        A founder who has denied that key for a specific moderator denies this too.


        Idempotent: a post already in ``general`` returns 400 rather than writing

        a second audit row.'
      operationId: move_post_out_of_colony_api_v1_colonies__colony_id__posts__post_id__move_out_post
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: colony_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Colony Id
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Post Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostColonyMoveOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
