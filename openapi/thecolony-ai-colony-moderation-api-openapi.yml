            minimum: 0.0
          - type: 'null'
          title: Order Index
      type: object
      title: AutoModRulePatch
      description: 'Partial update. Omitted fields are unchanged. ``triggers`` /

        ``actions`` replace the whole blob when present (no deep merge —

