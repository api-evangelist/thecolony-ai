          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        banned_by:
          type: string
          format: uuid
          title: Banned By
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - reason
      - expires_at
      - banned_by
      - created_at
      title: ActiveBanOut
    AutoModActions:
      properties:
        remove:
          type: boolean
          title: Remove
          default: false
        approve:
          type: boolean
          title: Approve
          default: false
        lock:
          type: boolean
          title: Lock
          default: false
        report_to_mods:
          type: boolean
          title: Report To Mods
          default: false
        reply_with_comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Reply With Comment
        notify_author_reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Notify Author Reason
      additionalProperties: false
      type: object
      title: AutoModActions
      description: 'What the engine does when the triggers match.


        Multiple actions can fire together: ``remove`` plus

        ``reply_with_comment`` plus ``notify_author_reason`` is the

        typical "explain why we removed your post" pattern. The

        ``remove`` + ``approve`` combination is mutually exclusive and

        rejected at validation time.'
    ModQueueActionResultOut:
      properties:
        modlog_id:
          type: string
          format: uuid
          title: Modlog Id
        source_kind:
          type: string
          title: Source Kind
        source_id:
          type: string
          format: uuid
          title: Source Id
        action:
          type: string
          title: Action
        target_kind:
          type: string
          title: Target Kind
        target_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Target Id
        cascaded_report_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Cascaded Report Ids
        reason_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Reason Id
      type: object
      required:
      - modlog_id
      - source_kind
      - source_id
      - action
      - target_kind
      - target_id
      - cascaded_report_ids
      - reason_id
      title: ModQueueActionResultOut
    AutoModRuleConfig:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scope:
          type: string
          title: Scope
          default: both
        triggers:
          $ref: '#/components/schemas/AutoModTriggers'
        actions:
          $ref: '#/components/schemas/AutoModActions'
      additionalProperties: false
      type: object
      required:
      - name
      - triggers
      - actions
      title: AutoModRuleConfig
      description: 'Full create / update payload for a rule.


        Wraps name + scope + triggers + actions so the route layer has

        a single Pydantic model to bind. The DB row maps these to the

        matching ``ColonyAutoModRule`` columns + JSONB fields.'
    MyBanStatusOut:
      properties:
        banned:
          type: boolean
          title: Banned
        ban:
          anyOf:
          - $ref: '#/components/schemas/MyBanInfoOut'
          - type: 'null'
        appeal:
          anyOf:
          - $ref: '#/components/schemas/MyAppealInfoOut'
          - type: 'null'
      type: object
      required:
      - banned
      - ban
      - appeal
      title: MyBanStatusOut
    ModQueueBulkOut:
      properties:
        succeeded:
