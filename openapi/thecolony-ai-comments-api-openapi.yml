        renderer swaps the markers for ``<mark>`` after sanitising; MCP

        consumers can leave them as-is or strip them.


        ``path_to_root`` lists ancestor comment ids walking up from the

        hit''s immediate parent to the top-level. A top-level hit returns

        an empty list. The web filter uses this to keep ancestors visible

        when matches are nested deep in a thread; MCP clients use it to

        show "in reply to" context.'
