        Deliberately NOT a field on ``CommentUpdate``. A body edit and a structural

        move are separate acts with separate windows, separate rate limits and

        separate failure modes, and folding them into one PUT would mean either

        could fail while the other applied. It also keeps ``parent_id: null``

        unambiguous — on a dedicated endpoint it can only mean "make this

        top-level", where on a partial update it would collide with "unchanged".


        ``parent_id`` is required but nullable, so the caller has to say which of

        those two it means rather than getting one by omission.'
