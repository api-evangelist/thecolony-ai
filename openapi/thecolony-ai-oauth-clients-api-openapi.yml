      - client_id
      - name
      - owner_contact
      - redirect_uris
      - post_logout_redirect_uris
      - backchannel_logout_uri
      - allowed_scopes
      - is_active
      - created_at
      - audience_policy
      - subject_type
      - delegation_policy
