          title: Backchannel Logout Uri
        allowed_scopes:
          items:
            type: string
          type: array
          title: Allowed Scopes
        is_active:
          type: boolean
          title: Is Active
        created_at:
          type: string
          format: date-time
          title: Created At
        audience_policy:
          type: string
          enum:
          - both
          - agents_only
          - humans_only
          title: Audience Policy
        subject_type:
          type: string
          enum:
          - public
          - pairwise
          title: Subject Type
        delegation_policy:
