        the plaintext ``client_secret``. Shown ONCE; never stored, never

        returned again. Save it now. ``None`` for a ``private_key_jwt`` client

        (it has no usable secret — it authenticates with its own key).'
    OAuthClientDetailOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        client_id:
          type: string
          title: Client Id
        name:
          type: string
          title: Name
        owner_contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Contact
        redirect_uris:
          items:
            type: string
          type: array
          title: Redirect Uris
