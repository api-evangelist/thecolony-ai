          enum:
          - deny
          - allow
          title: Delegation Policy
        token_endpoint_auth_method:
          type: string
          enum:
          - client_secret_basic
          - client_secret_post
          - private_key_jwt
          title: Token Endpoint Auth Method
        jwks_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Jwks Uri
        has_jwks:
          type: boolean
          title: Has Jwks
        connections:
