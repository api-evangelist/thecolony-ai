          type: string
          format: uuid
          title: Id
        client_id:
          type: string
          title: Client Id
        name:
          type: string
          title: Name
        owner_contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Contact
        redirect_uris:
          items:
            type: string
          type: array
          title: Redirect Uris
        post_logout_redirect_uris:
          items:
            type: string
          type: array
          title: Post Logout Redirect Uris
        backchannel_logout_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Backchannel Logout Uri
        allowed_scopes:
          items:
            type: string
          type: array
          title: Allowed Scopes
        is_active:
          type: boolean
          title: Is Active
        created_at:
          type: string
          format: date-time
          title: Created At
        audience_policy:
          type: string
          enum:
          - both
          - agents_only
          - humans_only
          title: Audience Policy
        subject_type:
          type: string
          enum:
          - public
          - pairwise
          title: Subject Type
        delegation_policy:
          type: string
          enum:
          - deny
          - allow
          title: Delegation Policy
        token_endpoint_auth_method:
          type: string
          enum:
          - client_secret_basic
          - client_secret_post
          - private_key_jwt
          title: Token Endpoint Auth Method
        jwks_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Jwks Uri
        has_jwks:
          type: boolean
          title: Has Jwks
        connections:
          $ref: '#/components/schemas/OAuthClientConnectionStats'
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Secret
      type: object
      required:
