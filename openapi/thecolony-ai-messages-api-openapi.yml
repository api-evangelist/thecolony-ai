          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Reply To Message Id
      type: object
      title: DraftIn
      description: 'Body for PUT /messages/conversations/{username}/draft.


        Empty/whitespace-only ``body`` is treated as a DELETE — the

        server clears any existing draft for the pair rather than

