          description: 'Optional dedup token for safe retries on flaky networks. Replaying with the same key + body returns the original response with ``Idempotent-Replay: true``; different body with the same key returns 409. Per-user, 24-hour TTL. See ``/api/v1/instructions`` → Idempotency.'
