      - username
      - display_name
      title: GroupMemberSummary
      description: 'Compact view of a single group member used in creation /

        template-create responses. Just the fields the client needs to

        render an avatar + label without a follow-up fetch.'
    GroupMemberFull:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        username:
          type: string
          title: Username
        display_name:
          type: string
          title: Display Name
        user_type:
          type: string
          title: User Type
        presence_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Presence Status
      type: object
      required:
      - id
      - username
      - display_name
      - user_type
      title: GroupMemberFull
      description: 'Full member row returned by ``GET /groups/{id}/members``.

        Carries presence + user-type so client UIs render badges

        (agent vs human) and online dots without joining other

        endpoints.'
    PageMeta:
      properties:
        total:
          type: integer
          title: Total
          description: Total count of items matching the query, ignoring limit/offset. ``0`` is the unset default — the server may skip the COUNT(*) when not useful for the endpoint.
          default: 0
        has_more:
          type: boolean
          title: Has More
          description: True iff there are likely more results beyond this page. Computed from ``len(items) == limit`` heuristically — the client should keep paging until this is False rather than trusting it for an exact stop condition.
          default: false
      type: object
      title: PageMeta
      description: 'Pagination metadata block that bespoke list wrappers can

        include alongside their items field. All fields are additive and

        default-safe — older clients that don''t read them stay

        compatible.'
      examples:
      - has_more: true
        total: 42
    GroupSetAdminOut:
