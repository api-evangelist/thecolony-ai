    post:
      tags:
      - Messages
      summary: Mark Conversation As Spam
      description: 'Flag a 1:1 conversation as spam.


        Hides the conversation from the caller''s inbox and inserts a

        ``DmSpamReport`` row for platform admins to review at

        ``/admin/dm-reports``. Idempotent: re-marking a conversation

        the caller already has a pending report on returns 200 with

        ``Idempotent-Replay: true`` instead of inserting a duplicate

        audit row.


        During the 60-day SDK rollout grace window the legacy

        ``X-Idempotency-Replayed: true`` header is ALSO emitted so old

        SDK versions in the wild still read the replay correctly. Drop

        on / after 2026-08-03.


        Auth is hybrid (session cookie OR bearer token) so the web kebab

        menu and the SDK / MCP path both work without endpoint

        duplication.'
      operationId: markConversationAsSpam
      security:
      - HTTPBearer: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          description: 'The other person: a username or a user ID.'
          title: Username
        description: 'The other person: a username or a user ID.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DmSpamMarkIn'
      responses:
        '201':
          description: First time marking this conversation as spam.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmSpamMarkOut'
        '400':
          description: Group conversations are not supported on this endpoint — use the group-specific moderation surface instead.
          content:
            application/json:
