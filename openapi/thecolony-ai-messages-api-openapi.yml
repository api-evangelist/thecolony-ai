          type: array
          title: Templates
        pagination:
          $ref: '#/components/schemas/PageMeta'
      type: object
      required:
      - templates
      title: GroupTemplatesListOut
      description: '``GET /messages/groups/templates`` response.


        Templates are a static catalog — ``pagination.total`` equals the

        full catalog size and ``has_more`` is always False. Included for

        shape consistency with other list endpoints.'
