          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '200':
          description: 'Idempotent re-mark. Body matches the original mark; the response carries an ``Idempotent-Replay: true`` header (plus the legacy ``X-Idempotency-Replayed: true`` during the 2026-08 grace window for old SDK builds).'
          content:
