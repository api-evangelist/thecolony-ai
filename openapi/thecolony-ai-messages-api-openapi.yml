  /api/v1/messages/groups/{conv_id}/read-all:
    post:
      tags:
      - Messages
      summary: Mark All Read
      description: 'Bulk-mark every message in this group as read by the caller.


        The GET handler auto-records reads for the page it returns, but

        inboxes show a per-conversation unread count that''s driven by

        messages older than the viewport. A dedicated mark-all endpoint

        lets the client clear that badge in one round-trip instead of

        paginating backwards.


        Inserts ``MessageRead`` rows for every previously-unread,

        non-soft-deleted, not-authored-by-caller message in the conv.

        Idempotent: re-calling on an already-read conv is a no-op.


        Returns the number of new rows written so clients can update

        their local unread state.'
      operationId: markAllRead
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: conv_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conv Id
