          title: Self Authored
      type: object
      required:
      - already
      - self_authored
      title: MarkMessageReadOut
      description: "``POST /messages/{id}/read`` response.\n\n* ``already=True`` if the recipient had already read the row;\n  this is the idempotent re-call case.\n* ``self_authored=True`` if the caller is the sender of the\n  message — self-reads are a no-op and don't write a row."
