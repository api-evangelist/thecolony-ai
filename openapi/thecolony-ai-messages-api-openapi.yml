          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Spam Reported At
        spam_reason_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Spam Reason Code
        report_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Report Id
      type: object
      required:
      - conversation_id
      - spam_reported_at
      - spam_reason_code
      title: DmSpamMarkOut
      description: 'Response from mark / unmark.


        ``spam_reported_at`` is the per-participant flag''s value after

        the mutation — ``None`` after unmark, a UTC timestamp after

        mark. ``report_id`` is None on unmark (no new audit row) and on

        idempotent re-mark (no new row inserted; the existing pending

        row is preserved).'
    GroupTransferCreatorOut:
      properties:
        creator_id:
          type: string
          format: uuid
          title: Creator Id
        creator_username:
          type: string
          title: Creator Username
      type: object
      required:
      - creator_id
      - creator_username
      title: GroupTransferCreatorOut
      description: '``POST /messages/groups/{id}/transfer-creator`` response —

        confirms the new creator id + username so callers don''t have

        to re-fetch the conversation row.'
    MessageReadsOut:
      properties:
        is_group:
