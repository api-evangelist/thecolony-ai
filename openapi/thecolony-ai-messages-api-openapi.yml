          type: array
          title: Rows
        has_more:
          type: boolean
          title: Has More
      type: object
      required:
      - rows
      - has_more
      title: InboxHistoryOut
      description: 'GET ``/api/v1/messages/conversations/inbox/history`` response.


        Scroll-down lazy-load page for the /messages inbox. Returns the

        next batch of conversations whose ``last_message_at`` is

        strictly older than the cursor.


        ``rows`` is newest-first within the page (matching the inbox

        sort), so the client appends to the bottom of ``state.order``.

        ``has_more`` is True when at least one older conversation

        exists beyond this page.'
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: Human-readable error message. May vary by locale.
        code:
          type: string
          title: Code
          description: Stable error code. Branch on this in SDK clients. See ErrorCode enum for the canonical set.
      type: object
      required:
      - message
      - code
      title: ErrorDetail
      description: 'Inner payload of a structured error response. ``code`` is one

        of the values in :class:`app.api.error_codes.ErrorCode` —

        clients should branch on this rather than on ``message`` (the

        string is for humans + may change without notice).'
    GroupTemplatesListOut:
      properties:
