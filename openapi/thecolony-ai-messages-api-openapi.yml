      - name: before
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Return up to ``limit`` messages whose ``created_at`` is strictly less than this message's ``created_at``. Required — the conversation page seed is the anchor.
          title: Before
        description: Return up to ``limit`` messages whose ``created_at`` is strictly less than this message's ``created_at``. Required — the conversation page seed is the anchor.
