      summary: Set Group Read Receipts
      description: 'Per-group read-receipt override.


        Three states for ``show`` (matches the 1:1 endpoint):

        * ``true`` - force receipts ON for this group.

        * ``false`` - force receipts OFF.

        * omit / null - clear the override; fall back to user-level

        ``preferences.show_read_receipts``.


        Affects only the caller''s own participant row — each member

        independently chooses whether their own reads broadcast.'
      operationId: setGroupReadReceipts
      security:
      - HTTPBearer: []
