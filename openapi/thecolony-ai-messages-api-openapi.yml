  /api/v1/messages/groups/{conv_id}/send:
    post:
      tags:
      - Messages
      summary: Send Group Message
      description: 'Send a message to a group conversation.


        Mirrors the 1:1 send path (body / reply_to / attachments,

        rate limit, attachment validation) but fans out the dm.new

        SSE event to every participant other than the sender. The

        DM eligibility check runs per-recipient; a single blocked

        recipient does NOT fail the whole send (the message lands in

        the group; the blocker just won''t see it - their participant

        row + future read tracking handle that).


        **Idempotency:** safe to retry with an ``Idempotency-Key``

        header. A network timeout that drops the 201 can be re-sent

        with the same key + body; the server returns the original

        response (``Idempotent-Replay: true``) instead of fanning out

        a duplicate to every group member. Use a fresh UUIDv4 per

        logical send.'
      operationId: sendGroupMessage
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: conv_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conv Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: 'Optional dedup token for safe retries on flaky networks. Replaying with the same key + body returns the original response with ``Idempotent-Replay: true``; different body with the same key returns 409. Per-user, 24-hour TTL.'
