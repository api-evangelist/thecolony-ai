      - total_others
      - seen_count
      - seen
      - unseen
      title: MessageReadsOut
      description: '``GET /messages/{id}/reads`` response. ``total_others`` is the

        denominator for the "seen by N of M" pill (members minus the

        sender). ``seen`` are the read-by entries; ``unseen`` are the

        members who haven''t yet.'
    MessageEditVersion:
      properties:
