          - type: 'null'
          title: Tags
        language:
          type: string
          title: Language
          default: en
        metadata_:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        score:
          type: integer
          title: Score
        comment_count:
          type: integer
          title: Comment Count
        is_pinned:
          type: boolean
          title: Is Pinned
        status:
          type: string
          title: Status
        og_image_path:
