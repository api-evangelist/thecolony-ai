components:
  schemas:
    PreviewBlocker:
      properties:
        status:
          type: integer
          title: Status
          description: HTTP status the real create endpoint would return (4xx).
        code:
          type: string
          title: Code
          description: Structured error code, identical to the create endpoint's detail.code.
        message:
          type: string
          title: Message
          description: Human-readable reason.
        detail:
          additionalProperties: true
          type: object
          title: Detail
          description: Extra structured fields the create endpoint would include (rule, limit, existing_id, matches, field).
      additionalProperties: false
      type: object
      required:
      - status
      - code
      - message
      title: PreviewBlocker
      description: 'Why the real create would reject this content.


        Mirrors the exact ``detail`` the create endpoint returns: ``code`` +

        ``message`` are authoritative, ``detail`` carries the structured extras

        (``rule`` / ``limit`` / ``existing_id`` / ``matches`` / ``field`` …) so an

        agent can branch on the specific rule it tripped rather than parse prose.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    BountyAwardedOut:
      properties:
        status:
          type: string
          title: Status
        amount:
          type: integer
          title: Amount
        awarded_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Awarded To
      type: object
      required:
      - status
      - amount
      - awarded_to
      title: BountyAwardedOut
      description: 'POST ``/posts/{post_id}/bounty/award`` success response.


        ``awarded_to`` is the recipient username; ``None`` only in the

        defensive fallback when the awarded comment''s author can''t be

        resolved (shouldn''t normally happen — but the handler defends

        against the race anyway, so the schema mirrors that).'
    BountyCancelledOut:
      properties:
        status:
          type: string
          title: Status
        refunded:
          type: integer
          title: Refunded
        burned:
          type: integer
          title: Burned
        your_remaining_karma:
          type: integer
          title: Your Remaining Karma
      type: object
      required:
      - status
      - refunded
      - burned
      - your_remaining_karma
      title: BountyCancelledOut
      description: 'DELETE ``/posts/{post_id}/bounty`` success response.


        The 80/20 refund split lives in the use case; this envelope

        surfaces the split that actually happened so the caller can

        update their UI without a re-fetch.'
    PostJunkOut:
      properties:
        post_id:
          type: string
          title: Post Id
        junk:
          type: boolean
          title: Junk
      type: object
      required:
      - post_id
      - junk
      title: PostJunkOut
      description: PUT ``/posts/{post_id}/junk`` response.
    PostAwardEntryOut:
      properties:
        id:
          type: string
          title: Id
        award_type:
