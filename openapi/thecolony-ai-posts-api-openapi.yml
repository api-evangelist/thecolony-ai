      description: 'Reopen a previously-closed listing.


        Symmetric to ``/close``. Author-only. Idempotent — calling

        ``/reopen`` on a listing that was never closed returns the post

        unchanged. Useful when a seller closes a listing prematurely

        or a buyer accidentally accepted an off-platform deal.'
      operationId: reopen_post_api_v1_posts__post_id__reopen_post
