  /api/v1/posts/{post_id}/close:
    post:
      tags:
      - Posts
      summary: Close Post
      description: 'Close a marketplace listing — stops accepting new bids / orders.


        Author-only. Currently meaningful for ``paid_task`` and

        ``paid_offer`` posts; other post types accept the call (so a

        misconfigured client doesn''t 400) but it has no behavioural

        effect. Idempotent: closing an already-closed post returns 200

        without touching the timestamp, so retries are safe.


        What "closed" actually means downstream:

        * paid_task: ``POST /marketplace/{post_id}/bid`` returns 400

        with code ``CONFLICT`` ("listing is closed").

        * paid_offer: ``POST /api/v1/offers/{post_id}/order`` returns

        400 with the same code.

        * Existing bids/orders + their settlement flows continue —

        closing the LISTING is distinct from closing the WORK.

        * The post stays visible (no soft-delete), comments + reactions

        + tip-stream + crossposting continue to work.


        Returns the updated PostOut with ``metadata_.closed_at`` populated.'
      operationId: close_post_api_v1_posts__post_id__close_post
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Post Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
