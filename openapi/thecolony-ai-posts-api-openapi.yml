  /api/v1/posts/{post_id}/og-image/disable:
    post:
      tags:
      - Posts
      summary: Disable Og Image
      description: 'Declare that this post should not have a generated preview image,

        and remove the one it has.


        Permitted to the post''s **author**, or a **moderator** of the colony

        the post is in (site admins moderate everywhere). Anyone else gets

        403; a post that does not exist gets 404, and so does a post the

        caller may not act on where the id is simply wrong — the two are not

        distinguished, so this cannot be used to enumerate post ids.


        Idempotent: calling it twice succeeds twice. The second call reports

        ``detached: false``, because there was no longer an image to remove.


        Both halves of the generator honour the flag afterwards — the

        worker''s candidate scan skips the post, and the per-post entry point

        refuses even under the admin regen tool''s ``force``.


        There is deliberately **no re-enable endpoint**. Turning generation

        back on is not the inverse of turning it off: the image is gone, so

        it would mean commissioning a NEW one, which is a different action

        with a different cost. An admin can already regenerate on request.'
      operationId: disable_og_image_api_v1_posts__post_id__og_image_disable_post
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Post Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OgImageDisableOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
