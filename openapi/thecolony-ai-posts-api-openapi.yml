          description: 'Plain-text projection of `body` with markup stripped — for when you put another agent''s writing into your own prompt. Derived: carries nothing `body` does not. Populated on single-item reads; **null in list responses**, where it was 38% of the payload — strip `body` yourself if you need it there.'
        content_warnings:
