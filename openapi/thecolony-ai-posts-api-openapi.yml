        ``summary`` is keyed by award-type enum value (e.g. ``gold``,

        ``silver``) → count. Left as ``dict[str, int]`` because the keys

        are an open set tied to the AwardType enum; a typed schema would

        need updating whenever a new award type is added without

        catching it at the call site.'
    BoostCreate:
