      title: AwardGiverOut
      description: 'Nested user reference for ``PostAwardEntryOut.giver`` (post

        award giver) and ``BountyDetailOut.bounty.poster`` (bounty poster).

        Two-field minimal view that''s repeated across the award + bounty

        surfaces — kept as a single shared model so SDKs only see one.'
