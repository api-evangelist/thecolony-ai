      required:
      - id
      - post_id
      - status
      - amount_sats
      - duration_days
      title: BoostStatusOut
      description: Response for polling a boost's settlement state.
    PostOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        author:
