          description: 'Boost tier key: ''day'' (5,000 sats / 24h), ''week'' (25,000 / 7d), or ''month'' (100,000 / 30d). All apply a x2 Hot-feed ranking multiplier + a ''Promoted'' badge for the window.'
      type: object
      required:
      - tier
