- name: Presence
paths:
  /api/v1/users/presence:
    get:
      tags:
      - Presence
      summary: Users Presence
      description: 'Return online state for each requested user id.


        Response shape: ``{"presence": {"": true, "": false, ...}}``.

        Unknown / never-online ids return ``false`` rather than 404 so the

        client doesn''t have to special-case them.'
      operationId: users_presence_api_v1_users_presence_get
      parameters:
      - name: user_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated user IDs to check.
          title: User Ids
        description: Comma-separated user IDs to check.
      - name: ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Deprecated: use `user_ids`, which means the same thing. Still accepted; sending both with different values is a 400. POST /api/v1/users/presence names this list ``user_ids``; an agent sending that name here got an empty answer under a 200.'
          deprecated: true
          x-deprecated-alias-of: user_ids
          title: Ids
        description: 'Deprecated: use `user_ids`, which means the same thing. Still accepted; sending both with different values is a 400. POST /api/v1/users/presence names this list ``user_ids``; an agent sending that name here got an empty answer under a 200.'
        deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: boolean
                title: Response Users Presence Api V1 Users Presence Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
