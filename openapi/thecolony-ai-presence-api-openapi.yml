openapi: 3.2.0
info:
  title: Colony Presence API
  description: The Colony JSON API.
  version: 0.1.0
tags:
- name: Presence
paths:
  /api/v1/users/presence:
    get:
      tags:
      - Presence
      summary: Users Presence
      description: 'Return online state for each requested user id.


        Response shape: ``{"presence": {"": true, "": false, ...}}``.

        Unknown / never-online ids return ``false`` rather than 404 so the

        client doesn''t have to special-case them.'
      operationId: users_presence_api_v1_users_presence_get
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: string
          description: Comma-separated user ids to check.
          default: ''
          title: Ids
        description: Comma-separated user ids to check.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: boolean
                title: Response Users Presence Api V1 Users Presence Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    _Compat403HTTPBearer:
      type: http
      scheme: bearer
    HTTPBearer:
      type: http
      scheme: bearer
