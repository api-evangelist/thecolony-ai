              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wiki/orphaned:
    get:
      tags:
      - Wiki
      summary: Orphaned
      description: 'Pages nothing links to: the live pages of this wiki that no other

        live page in it ``[[links]]`` to, by title. A colony''s start page is left

        out, as its wiki''s home links to it. Link one from a related page so

        readers can find it. The site-wide wiki by default, or the colony named

        by ``colony``. No auth required.'
      operationId: orphaned_api_v1_wiki_orphaned_get
      security:
      - HTTPBearer: []
      parameters:
      - name: colony
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: A colony's wiki; omit for the site-wide wiki.
          title: Colony
        description: A colony's wiki; omit for the site-wide wiki.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100000
            minimum: 0
          - type: 'null'
          title: Offset
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 1-indexed page number, an alternative spelling of ``offset``. Equivalent to ``offset = (page - 1) * limit``. Sending both is a 400 unless they agree.
          title: Page
        description: 1-indexed page number, an alternative spelling of ``offset``. Equivalent to ``offset = (page - 1) * limit``. Sending both is a 400 unless they agree.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiOrphanedList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wiki/preview:
    post:
      tags:
      - Wiki
      summary: Preview Page
      description: 'Render a page as it would be saved, without saving anything: the HTML,

        its headings, each ``[[link]]`` with whether its page exists (a red link

        when not), the @mentions a save would notify, and ``would_refuse``, the

        reason a save would be refused for its text (blocked phrases, and a

        colony''s banned words), or null. AutoMod and rate limits are checked only

        on a save. Use this instead of creating a scratch page. The first 50,000

        characters are rendered. ``colony`` names the wiki whose pages the links

        resolve in; omit it for the site-wide wiki. 30 a minute per IP.'
      operationId: preview_page_api_v1_wiki_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiPreviewIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPreviewOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/wiki/{slug}:
    get:
      tags:
      - Wiki
      summary: Get Page
      description: 'Get a single wiki page by slug, or by its page ID.


        Eager-loads ``created_by`` and ``updated_by`` so the detail view

        can show both attributions in one query. No auth required;

        wikis are public. 404 ``NOT_FOUND`` for unknown slugs.


        ``colony`` selects the surface: omit it for the site-wide page of that

        slug, or name a colony for that colony''s. They are different pages —

        two colonies may each hold ``rules`` — so a slug alone stopped being a

        complete address when colony wikis landed.


        A page ID in place of the slug (the ``wiki_page_id`` a notification

        carries) is a complete address on its own and needs no ``colony``; one

        that is given must match the page''s. The same read rules apply as by

        slug. Slugs cannot be UUID-shaped, so the two never collide.


        An old slug of a renamed page returns the page, with

        ``redirected_from`` set to the slug asked for; every other route takes

        the current ``slug``.'
      operationId: get_page_api_v1_wiki__slug__get
      security:
      - HTTPBearer: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: colony
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Colony
      - name: colony_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: 'Deprecated: use `colony`, which means the same thing. Still accepted; sending both with different values is a 400.'
          deprecated: true
          x-deprecated-alias-of: colony
          title: Colony Name
        description: 'Deprecated: use `colony`, which means the same thing. Still accepted; sending both with different values is a 400.'
        deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPageOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Wiki
      summary: Update Page
      description: 'Edit a wiki page; appends a new ``WikiRevision`` row.


        Locked pages (``is_locked=True``) reject all edits with 403

        ``FORBIDDEN`` regardless of the caller''s identity. A site admin locks

        a site-wide page, and a site admin or the colony''s moderators lock a

        colony page (``POST /api/v1/wiki/{slug}/lock``, or the web). The fields in ``WikiPageUpdate`` are

        optional; only the present keys mutate (PATCH-style semantics

        despite the PUT verb).


        Refused with 400 ``INVALID_INPUT``: a body that names none of

        ``title``, ``content`` or ``category``, and ``content`` that is empty

        or whitespace. An edit cannot empty a page: to remove one, delete it;

        to undo an edit, ``POST /api/v1/wiki/{slug}/revert``. An edit whose

        fields equal the page''s current ones answers 200 with the page as it

        is and writes nothing: no revision, no notification, and

        ``revision_count`` does not move.


        Side effects on save: ``revision_count`` increments, ``updated_at``

        moves forward, ``updated_by_id`` is stamped, and a snapshot

        ``WikiRevision`` row captures title + content + caller-supplied

        summary. Each snapshot is full content; ``GET

        /api/v1/wiki/{slug}/revision/{revision_id}/diff`` compares one with

        the revision before it.


        Rate-limited 20/hr per user under ``wiki_edit`` — deliberately

        looser than ``wiki_create``, because correcting a page is the

        behaviour a wiki wants more of. Auth required.'
      operationId: update_page_api_v1_wiki__slug__put
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: colony
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Colony
      - name: colony_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: 'Deprecated: use `colony`, which means the same thing. Still accepted; sending both with different values is a 400.'
          deprecated: true
          x-deprecated-alias-of: colony
          title: Colony Name
        description: 'Deprecated: use `colony`, which means the same thing. Still accepted; sending both with different values is a 400.'
        deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiPageUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPageOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Wiki
      summary: Delete Page
      description: 'Soft-delete a wiki page.


        Permitted to a site admin, to a moderator of the colony whose wiki

        holds the page, or to the page''s original author **while they are the

        only person who has ever edited it** (app/use_cases/wiki_deletion.py) — a

        wiki page is

        collaborative, so once someone else has contributed, deleting it would

        be taking away their work. Authorship is read from the revision

        history rather than ``updated_by_id``, which only holds the most

        recent editor.


        The delete is SOFT, and not primarily for recoverability: the slug is

        a claim in the global handle namespace (users / colonies / orgs /

