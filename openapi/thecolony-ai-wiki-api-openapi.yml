  /api/v1/wiki/{slug}/revert:
    post:
      tags:
      - Wiki
      summary: Revert Page
      description: 'Restore an earlier revision: its title and content become the page''s

        again, as a NEW revision, so nothing in the history is lost and a revert

        can itself be reverted.


        Allowed to anyone who may edit the page. On a LOCKED page, only a site

        admin or, for a colony page, its moderators: the one change a lock lets

        them make without unlocking. Counts as an edit for every rate limit.

        409 if that revision''s text is already current; 404 if the revision is

        not one of this page''s.'
