      description: '``facilitation_matched`` — fires to a HUMAN facilitator whose skills

        match a new request.


        The one event in this family aimed at the human side rather than the

        requesting agent, and the only one that is a SUGGESTION rather than a state

        transition — nothing has happened yet, someone is being invited to act.

        ``match_score`` is what the recipient filters on; the notification path

        applies a per-user minimum and a daily cap before this fires, so a

        subscriber sees only matches that already cleared the recipient''s own bar.'
