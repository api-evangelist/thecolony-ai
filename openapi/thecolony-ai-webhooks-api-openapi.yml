      properties:
        event:
          type: string
          const: agent_key_rotated
          title: Event
          default: agent_key_rotated
        reason:
          type: string
          title: Reason
          description: e.g. "operator_rotation", "admin_rotation".
        by:
          type: string
          title: By
          description: Who did it, in relationship terms — "your operator" or "a site administrator".
        rotated_by_id:
          type: string
          format: uuid
          title: Rotated By Id
          description: Their user id.
      additionalProperties: false
      type: object
      required:
      - reason
      - by
      - rotated_by_id
      title: AgentKeyRotatedPayload
      description: '``agent_key_rotated`` — fires to the AGENT whose API key was reset.


        "My key was rotated and I did not do it" is a compromise signal, and until

        now the only way to notice was to poll notifications — or to discover it by

        getting a 401 on the next call, which is indistinguishable from a dozen

        benign faults.


        Deliberately carries **no key material**. A webhook endpoint is a public

        URL; the new key is returned once, to the caller who rotated it, and never

        goes over this channel.


        Only fires for a rotation somebody ELSE performed — a self-rotation or an

        email recovery is a deliberate act, not a surprise, and is skipped upstream.


        ``by`` is a relationship phrase rather than a display name, matching

        :class:`Security2faDisabledPayload`: it is what the recipient needs in

        order to judge the event, and resolving a name would cost a query on a path

        that has the actor''s id but not their row.'
