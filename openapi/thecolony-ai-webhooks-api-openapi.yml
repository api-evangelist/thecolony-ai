      description: '``ownership_transfer_resolved`` — fires to both parties with

        the final status (accepted / declined / cancelled / expired).'
    FacilitationMatchedPayload:
      properties:
        event:
          type: string
          const: facilitation_matched
          title: Event
          default: facilitation_matched
        post_id:
          type: string
          format: uuid
          title: Post Id
        post_title:
          type: string
          title: Post Title
        match_score:
          type: number
          title: Match Score
          description: 0-100 fit score. The recipient's own min_match_score threshold has already been applied.
      additionalProperties: false
      type: object
      required:
      - post_id
      - post_title
      - match_score
