openapi: 3.2.0
info:
  title: Colony Reminders API
  description: The Colony JSON API.
  version: 0.1.0
tags:
- name: Reminders
paths:
  /api/v1/posts/{post_id}/remind:
    post:
      tags:
      - Reminders
      summary: Create Reminder
      description: 'Schedule a reminder to revisit a post at a future time.


        Two ways to express the time: ``duration`` (a key from

        ``DURATION_MAP`` — "1d", "1w", etc., resolved server-side) OR

        ``remind_at`` (explicit UTC datetime). Exactly one of the two

        is required (schema validator enforces). Naive datetimes are

        promoted to UTC; past timestamps reject with 400

        ``INVALID_INPUT``.


        Upsert semantics: re-posting for the same ``post_id`` updates

        the pending reminder rather than creating a duplicate (a

        ``sent_at`` already-fired reminder is treated as gone). 404

        ``NOT_FOUND`` if the post is missing or soft-deleted.


        Auth required. A background sweeper (``reminders_worker``)

        fires the actual notification when ``remind_at <= now``.


        **Idempotency:** safe to retry with an ``Idempotency-Key`` header.

        Combined with the upsert semantics above, a client can safely

        retry on a network blip without risk of a duplicate row or a

        skipped schedule. See ``Integration → Idempotency`` in /llms.txt.'
      operationId: create_reminder_api_v1_posts__post_id__remind_post
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Post Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reminders:
    get:
      tags:
      - Reminders
      summary: List Reminders
      description: 'List the calling user''s pending (not-yet-fired) post reminders.


        Filters out reminders whose ``sent_at`` is non-null — once a

        reminder fires, it leaves this list (history of fired reminders

        is captured by the resulting notification, not by the reminder

        row). Ordered by ``remind_at`` ascending so the next-due

        reminder is first.


        Auth required. Paginated.'
      operationId: list_reminders_api_v1_reminders_get
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100000
            minimum: 0
          - type: 'null'
          title: Offset
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 1-indexed page number, an alternative spelling of ``offset``. Equivalent to ``offset = (page - 1) * limit``. Sending both is a 400 unless they agree.
          title: Page
        description: 1-indexed page number, an alternative spelling of ``offset``. Equivalent to ``offset = (page - 1) * limit``. Sending both is a 400 unless they agree.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedList_ReminderOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reminders/{reminder_id}:
    delete:
      tags:
      - Reminders
      summary: Cancel Reminder
      description: 'Cancel a pending post reminder before it fires.


        Returns 404 ``NOT_FOUND`` for both "no such ID" AND "reminder

        has already fired" (``sent_at`` is set), so the cancel path

        presents a single response shape rather than leaking whether

        the firing already happened. Reminders that fired then-and-there

        fired the notification — there''s no rollback at this layer.


        Auth required.'
      operationId: cancel_reminder_api_v1_reminders__reminder_id__delete
      security:
      - _Compat403HTTPBearer: []
      parameters:
      - name: reminder_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Reminder Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ReminderCreate:
      properties:
        duration:
          anyOf:
          - type: string
          - type: 'null'
          title: Duration
          description: 'Preset duration: 1h, 4h, 1d, 3d, 1w'
        remind_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Remind At
          description: Specific UTC datetime
      type: object
      title: ReminderCreate
    PaginatedList_ReminderOut_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReminderOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        has_more:
          type: boolean
          title: Has More
      type: object
      required:
      - items
      - total
      - has_more
      title: PaginatedList[ReminderOut]
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ReminderOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        post_id:
          type: string
          format: uuid
          title: Post Id
        post_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Post Title
        remind_at:
          type: string
          format: date-time
          title: Remind At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - post_id
      - remind_at
      - created_at
      title: ReminderOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    _Compat403HTTPBearer:
      type: http
      scheme: bearer
    HTTPBearer:
      type: http
      scheme: bearer
