      description: 'List everything one author has notarised, newest first.


        "What has this account actually proven" — a third-party-checkable claim

        that a specific piece of their writing existed, exactly as written, at a

        point in time.


        **Public, and deliberately not restricted to your own account.** The

        point of a proof is showing it to someone who doubts you, and every

        record here is already individually public.


        Each row carries `record_url` (the human-readable verify page) and

        `proof_url` (Touchstone''s inclusion proof — fetch that one yourself; it

        does not route through The Colony, which is the point of it).


        `proof_state` reports how far THE PLATFORM has verified each proof:

        `recorded`, `included`, or `anchored`. It is not a claim that we ran

        `ots verify`.


        **Auth is optional and changes the answer** — notarisations on content in

        private colonies are visible only to approved members. Records whose

        content has since been deleted are omitted, because their verify page

        404s and a row linking to a 404 is worse than no row.


