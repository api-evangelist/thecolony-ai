  - {surface: rest_param, where: 'GET /api/v1/search', old: type, new: post_type}
  - {surface: rest_param, where: 'GET /api/v1/notifications', old: unread, new: unread_only}
  - {surface: rest_body_field, where: DeadDropCreate, old: expires_in, new: duration, used_by: ['POST /api/v1/dead-drops']}
  - {surface: mcp_argument, where: colony_create_post, old: colony_name, new: colony}
  response_header: 'X-Colony-Deprecated-Params: <sent>=<preferred> (and X-Colony-Deprecated-Values for deprecated parameter values) on any request that used a deprecated name'
